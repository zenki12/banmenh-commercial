# Production KV id must be set via wrangler before production deploy.
name = "banmenh-kb"
main = "src/index.ts"
compatibility_date = "2026-05-23"

[env.dev]
name = "banmenh-kb-dev"

[env.dev.vars]
TAROT_COMBO_TEST_MODE = "true"

[[env.dev.kv_namespaces]]
binding = "BANMENH_KB_DEV"
id = "70886bee025145cf8ff352bcfa0148b6"

[[env.dev.r2_buckets]]
binding = "TAROT_KB_R2"
bucket_name = "banmenh-tarot-kb-dev"

[env.production]
name = "banmenh-kb-prod"

[env.production.vars]
TAROT_COMBO_TEST_MODE = "false"

[[env.production.kv_namespaces]]
binding = "BANMENH_KB_DEV"
id = "d589659ab5614636adc0d2620d922a43"

[[env.production.r2_buckets]]
binding = "TAROT_KB_R2"
bucket_name = "banmenh-tarot-kb-prod"
